name: Slicer dependency install

# Installs this extension's runtime dependencies (itk-ants, antspyx and friends) into a
# real Slicer on Linux, macOS and Windows, by calling the extension's OWN installer
# functions, and then imports them.
#
# Why this is separate from slicer-smoke.yml, and why it runs on a schedule:
#
#  * It is slow and it downloads hundreds of megabytes.
#  * It depends on PyPI, which nobody here controls.  An outage there is not a reason
#    to block a pull request.
#  * The things it catches do not arrive with a commit.  They arrive when PyPI stops
#    publishing a wheel for our platform or our Python version, when Slicer's bundled
#    Python moves, or when a transitive dependency changes its pins.  A weekly run
#    finds those; a per-PR run would only repeat them.
#
# Run it by hand from the Actions tab (Run workflow) whenever the install code changes.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  deps:
    name: ${{ matrix.name }} / Slicer ${{ matrix.stability }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60    # the wheels are large and the runners are not fast
    # Advisory on preview: an early warning that the next Slicer release changes
    # something (its Python version, its bundled scipy) that our installers assume.
    continue-on-error: ${{ matrix.stability == 'preview' }}
    strategy:
      fail-fast: false
      matrix:
        stability: [release, preview]
        os: [ubuntu-24.04, macos-latest, windows-latest]
        include:
          - os: ubuntu-24.04
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/slicer
        with:
          stability: ${{ matrix.stability }}
          script: Testing/ci_deps.py
          module-paths: |
            ITKANTsCommon
            ANTsRegistration
          timeout-seconds: "3000"

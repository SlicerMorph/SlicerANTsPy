name: Slicer dependency install

# EXPERIMENT BRANCH -- do not merge.
#
# This is the experiment/antspyx-itk-match version of the weekly dependency workflow,
# temporarily repurposed to answer one question: does the PyPI antspyx wheel still clash
# with Slicer's ITK on Linux, and does the Box wheel we substituted for it still match?
#
# It reuses this filename on purpose.  `workflow_dispatch` only offers workflows that
# exist on the default branch, but dispatching with --ref runs THIS branch's copy -- so
# the experiment needs no new file on main and nothing to clean up there afterwards.
#
# Linux only: this is an ELF symbol-resolution problem and it has never reproduced on
# macOS or Windows, where production already uses the PyPI wheel without trouble.
#
# The real version of this file is on main.

on:
  workflow_dispatch:

jobs:
  antspyx-itk:
    name: Linux / ${{ matrix.stability }} / ${{ matrix.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Each dependency on its own, then the two combinations a user can end up with.
        # The actual question: does the PyPI wheel work on Ubuntu 24.04 against BOTH
        # Slicer lines, in the full combination a user really has (itk-ants installed
        # and loaded)?  Box is the control arm.
        source: [itkants+touch+box, itkants+touch+pypi]
        stability: [release, preview]
    steps:
      - uses: actions/checkout@v4
      - name: Select the combination
        # Written to GITHUB_ENV so the Slicer process started by the action inherits it.
        run: echo "COMBO=${{ matrix.source }}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/slicer
        with:
          stability: ${{ matrix.stability }}
          script: Testing/ci_antspyx_itk.py
          module-paths: |
            ITKANTsCommon
            ANTsRegistration
          timeout-seconds: "3000"
